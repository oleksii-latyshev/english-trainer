pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,ts,jsx,tsx,json,css}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      run: bun run typecheck
    rust-fmt:
      glob: "src-tauri/**/*.rs"
      run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

post-checkout:
  commands:
    codebase-memory:
      run: sh ./scripts/cbm-reindex.sh

post-merge:
  commands:
    codebase-memory:
      run: sh ./scripts/cbm-reindex.sh
