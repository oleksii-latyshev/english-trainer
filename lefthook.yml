pre-commit:
  parallel: true
  commands:
    biome:
      run: bun run check
    typecheck:
      run: bun run typecheck
    effect:
      run: bun run check:effect
    conventions:
      run: bun run check:conventions
    knip:
      run: bun run check:knip
    frontend-tests:
      run: bun run test
    rust:
      run: sh ./scripts/check-rust.sh

post-checkout:
  commands:
    codebase-memory:
      run: sh ./scripts/cbm-reindex.sh

post-merge:
  commands:
    codebase-memory:
      run: sh ./scripts/cbm-reindex.sh
