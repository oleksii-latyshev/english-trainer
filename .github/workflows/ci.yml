name: CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Biome, Typecheck, Test)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and linting (Biome)
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Effect diagnostics
        run: bun run check:effect

      - name: Conventions (no comments, feature flow diagrams)
        run: bun run check:conventions

      - name: Run unit tests
        run: bun run test

  rust:
    name: Rust (Format, Clippy, Test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (version and components from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check Rust formatting, Clippy, and tests
        run: sh ./scripts/check-rust.sh

  e2e:
    name: Browser flows (Playwright)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install chromium

      - name: Typecheck browser tests
        run: bun run typecheck:e2e

      - name: Run browser flows
        run: bun run test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
