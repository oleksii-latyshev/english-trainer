name: CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Biome, Typecheck, Test)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and linting (Biome)
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Effect diagnostics
        run: bun run check:effect

      - name: Conventions (no comments, feature flow diagrams)
        run: bun run check:conventions

      - name: Run unit tests
        run: bun run test

  rust:
    name: Rust (Format, Clippy, Test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust (version and components from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Setup Python for the fake whisper-server in Rust tests
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Diagnose fake whisper-server (temporary)
        run: |
          set -x
          which -a python3 || true
          python3 --version
          env | grep -iE 'proxy|DEVELOPER_DIR|TMPDIR' || true
          dir=$(mktemp -d)
          python3 - "$dir" <<'PY'
          import re, sys, pathlib
          src = pathlib.Path("src-tauri/src/audio/server_tests.rs").read_text()
          body = re.search(r'const FAKE_SERVER: &str = r#"(.*?)"#;', src, re.S).group(1)
          path = pathlib.Path(sys.argv[1]) / "whisper-server"
          path.write_text(body)
          path.chmod(0o755)
          PY
          touch "$dir/ggml-small.en.bin"
          "$dir/whisper-server" -m "$dir/ggml-small.en.bin" --host 127.0.0.1 --port 18765 > "$dir/out.log" 2>&1 &
          pid=$!
          for i in $(seq 1 40); do
            if nc -z 127.0.0.1 18765; then echo "listening after ${i}x0.5s"; break; fi
            if ! kill -0 $pid 2>/dev/null; then echo "server exited"; break; fi
            sleep 0.5
          done
          ps -o pid,stat,etime,command -p $pid || true
          cat "$dir/out.log"
          kill $pid 2>/dev/null || true
          time python3 -c 'import http.server; print("imports ok")'

      - name: Check Rust formatting, Clippy, and tests
        run: sh ./scripts/check-rust.sh

  e2e:
    name: Browser flows (Playwright)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install chromium

      - name: Typecheck browser tests
        run: bun run typecheck:e2e

      - name: Run browser flows
        run: bun run test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
