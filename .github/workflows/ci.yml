name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Biome, Typecheck, Test)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and linting (Biome)
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test

  rust:
    name: Rust (Format, Clippy, Test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check Rust formatting, Clippy, and tests
        run: sh ./scripts/check-rust.sh

  e2e:
    name: Browser flows (Playwright)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install chromium

      - name: Typecheck browser tests
        run: bun run typecheck:e2e

      - name: Run browser flows
        run: bun run test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  macos-build:
    name: Installable macOS alpha (Apple Silicon)
    needs: [frontend, rust, e2e]
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build app and DMG
        run: bun run build:desktop

      - name: Archive app preserving its bundle metadata
        run: ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/English Trainer.app" "src-tauri/target/release/bundle/English-Trainer-macos-arm64.app.zip"

      - name: Upload installer and app
        uses: actions/upload-artifact@v4
        with:
          name: English-Trainer-macos-arm64-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/English-Trainer-macos-arm64.app.zip
          if-no-files-found: error
          retention-days: 14
