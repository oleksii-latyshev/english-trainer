name: Task
description: A unit of work with a stated boundary
title: "type(scope): imperative subject"
body:
  - type: markdown
    attributes:
      value: |
        The title becomes the squash-commit subject: a conventional commit, lower case, imperative,
        no trailing period, under 72 characters. The scope is the `area:` label without its prefix.

        Apply exactly one `type:`, `area:`, `priority:` and `size:` label, and a milestone.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One sentence, in the learner's terms rather than implementation terms.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: A checklist someone else could verify without asking a question. Mark what needs the physical Mac.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints touched
      description: Product invariants (AGENTS.md), contracts (TECHNICAL_REQUIREMENTS.md) or latency targets this work is near. Write "none" only after checking.
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue deliberately does not do. Naming the boundary prevents scope creep.
    validations:
      required: true
